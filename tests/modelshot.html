<!doctype html><meta charset=utf-8><body style="margin:0;background:#16202b">
<script type="importmap">{ "imports": { "three": "../js/vendor/three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { makeModel, modelMaterial } from '../js/models.js';
const q = new URLSearchParams(location.search), list = (q.get('m') || 'fighter').split(','), tiers = (q.get('t') || '1,2,3').split(','), yaw = +(q.get('yaw') || 0.8), pitch = +(q.get('pitch') || 0.5);
const W = 480, H = 360, cols = tiers.length, rows = list.length;
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(W * cols, H * rows); document.body.appendChild(r.domElement); r.setScissorTest(true); r.setClearColor(0x16202b);
modelMaterial.flatShading = false; modelMaterial.envMapIntensity = 0.5; modelMaterial.needsUpdate = true;
const scene = new THREE.Scene(); scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x4d4a3a, 1.2)); const sun = new THREE.DirectionalLight(0xfff0d0, 2.2); sun.position.set(-30, 60, 40); scene.add(sun);
const fl = new THREE.Mesh(new THREE.CircleGeometry(400, 32), new THREE.MeshStandardMaterial({ color: 0x2b3a2a })); fl.rotation.x = -Math.PI / 2; fl.position.y = -2.0; scene.add(fl);
const cam = new THREE.PerspectiveCamera(38, W / H, 0.5, 1500);
list.forEach((m, ri) => tiers.forEach((t, ci) => {
  const id = +t > 1 ? m + t : m; const o = makeModel(id, 0); scene.add(o.root);
  const box = new THREE.Box3().setFromObject(o.root), c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3()), rad = Math.max(s.x, s.y, s.z) * 0.62 + 1;
  o.root.position.y = 0; const d = rad / Math.tan(0.33) * 0.62;
  cam.position.set(c.x + Math.sin(yaw) * Math.cos(pitch) * d, c.y + Math.sin(pitch) * d, c.z + Math.cos(yaw) * Math.cos(pitch) * d); cam.lookAt(c);
  r.setViewport(ci * W, (rows - 1 - ri) * H, W, H); r.setScissor(ci * W, (rows - 1 - ri) * H, W, H); r.render(scene, cam); scene.remove(o.root);
}));
window.done = true;
</script>
